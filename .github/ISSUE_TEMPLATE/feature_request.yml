name: Feature Request
description: Suggest a new capability or an improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check the roadmap (https://github.com/users/jimmykurian/projects/2) and the decision
        records in docs/architecture/decisions/ for ideas already on the list, and add your
        use case to an existing issue if there is one.

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - Model rules (TGM001 to TGM014)
        - Analyzers (TG001 to TG005)
        - Write guard (SaveChanges)
        - Isolation probe and seeding
        - Options and registration (UseTenantGuard)
        - Finbuckle or another tenancy package
        - EF Core versions and providers
        - Logging
        - Packages and releases
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What can't you do today, or what's awkward?
      placeholder: "Our tenant key is an organization id on every row, so..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the behavior you'd like, with an example model or configuration if it helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Including what you do today, such as a Bypass scope or an AllowCrossTenantAccess attribute.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
    validations:
      required: false
