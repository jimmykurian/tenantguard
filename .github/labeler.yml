# Labels for pull requests by the paths they change (actions/labeler, run by
# .github/workflows/labeler.yml). A pull request can get several.

# Code, by package

runtime:
  - changed-files:
      - any-glob-to-any-file:
          - "src/TenantGuard.EntityFrameworkCore/**"

analyzers:
  - changed-files:
      - any-glob-to-any-file:
          - "src/TenantGuard.Analyzers/**"

test kit:
  - changed-files:
      - any-glob-to-any-file:
          - "src/TenantGuard.Testing/**"

tool:
  - changed-files:
      - any-glob-to-any-file:
          - "src/TenantGuard.Tool/**"
          - "src/TenantGuard.Tool.Payload/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

pins:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/integration/TenantGuard.BehaviorPins/**"

samples:
  - changed-files:
      - any-glob-to-any-file:
          - "samples/**"
          - "tests/e2e/**"

# Contracts and docs

spec:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/reference/**"
          - "docs/architecture/decisions/**"
          - "**/PublicAPI.*.txt"
          - "src/TenantGuard.Analyzers/AnalyzerReleases.*.md"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

agents:
  - changed-files:
      - any-glob-to-any-file:
          - "**/AGENTS.md"

security:
  - changed-files:
      - any-glob-to-any-file:
          - "SECURITY.md"
          - ".githooks/**"

# Repository plumbing

ci/cd:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

configuration:
  - changed-files:
      - any-glob-to-any-file:
          - ".editorconfig"
          - ".gitignore"
          - ".gitattributes"
          - ".gitmessage"
          - "stylecop.json"
          - "global.json"
          - "Directory.Build.props"
          - "TenantGuard.slnx"
          - "Taskfile.yml"

hooks:
  - changed-files:
      - any-glob-to-any-file:
          - ".githooks/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "Directory.Packages.props"
          - "global.json"
