name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

# Every check, then their results:
#
#   ci ─────────┬─ report (pull requests: a table of every check, as a PR comment)
#   ci-parity ──┴─ badges (main only: the README status table)
#
# One step per check, each with an id, so the report and badges jobs can show each one. Every
# check runs even when an earlier one failed (!cancelled()), so each shows its own result.
jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      format: ${{ steps.format.outcome }}
      api: ${{ steps.api.outcome }}
      headers: ${{ steps.headers.outcome }}
      scenarios: ${{ steps.scenarios.outcome }}
      metrics: ${{ steps.metrics.outcome }}
      build: ${{ steps.build.outcome }}
      unit: ${{ steps.unit.outcome }}
      architecture: ${{ steps.architecture.outcome }}
      integration: ${{ steps.integration.outcome }}
      pack: ${{ steps.pack.outcome }}
      samples: ${{ steps.samples.outcome }}
      e2e: ${{ steps.e2e.outcome }}
      scrub: ${{ steps.scrub.outcome }}
      site_install: ${{ steps.site_install.outcome }}
      site: ${{ steps.site.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK comes from global.json; 10.0.x adds the .NET 10 runtimes for the net10.0
          # test builds and the samples.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      # Node and pnpm for the docs site only (site/).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Format
        id: format
        if: ${{ !cancelled() }}
        run: task lint:format
      - name: Public API
        id: api
        if: ${{ !cancelled() }}
        run: task lint:api
      - name: License headers
        id: headers
        if: ${{ !cancelled() }}
        run: task lint:headers
      - name: LightBDD scenarios
        id: scenarios
        if: ${{ !cancelled() }}
        run: task lint:scenarios
      - name: Code metrics
        id: metrics
        if: ${{ !cancelled() }}
        run: task metrics:check
      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: task build
      - name: Unit tests
        id: unit
        if: ${{ !cancelled() }}
        run: task test:unit
      - name: Architecture tests
        id: architecture
        if: ${{ !cancelled() }}
        run: task test:architecture
      - name: Integration tests
        id: integration
        if: ${{ !cancelled() }}
        run: task test:integration
      - name: Pack
        id: pack
        if: ${{ !cancelled() }}
        run: task pack
      - name: Samples
        id: samples
        if: ${{ !cancelled() }}
        run: task samples
      - name: End-to-end tests
        id: e2e
        if: ${{ !cancelled() }}
        run: task test:e2e
      - name: Scrub
        id: scrub
        if: ${{ !cancelled() }}
        run: task scrub
      - name: Docs site install
        id: site_install
        if: ${{ !cancelled() }}
        run: task site:install
      - name: Docs site
        id: site
        if: ${{ !cancelled() }}
        run: task site:check

  ci-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jimmykurian/ci-parity@5f5d62bb19a1a3c63ebe065bfcef6e8dc934d1ed # v0 (v0.10.0)
        with:
          # A SHA ref would otherwise resolve to the latest release, which may be a new major.
          version: v0.10.0

  # Posts one comment on the pull request with a table of every check, and updates it on each
  # push, like ci-parity's.
  report:
    name: Check table
    needs: [ci, ci-parity]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # creates and updates the comment
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const marker = '<!-- pr-check-table -->';
            // Each result is a word; the symbol only repeats it.
            const shown = {
              success: '✅ Passed',
              failure: '❌ Failed',
              cancelled: '⏹️ Cancelled',
              skipped: '⏭️ Skipped',
            };
            const result = (outcome) => shown[outcome] ?? '⚠️ Not run';

            // [check, how it runs, the ci job's output, or '' for the job's own result] per section.
            const sections = [
              {
                title: 'Lint',
                job: 'ci',
                rows: [
                  ['Format and Roslyn analyzers (dotnet format)', '`task lint:format`', 'format'],
                  ['Public API files (PublicApiAnalyzers)', '`task lint:api`', 'api'],
                  ['License headers', '`task lint:headers`', 'headers'],
                  ['No LightBDD [Scenario]', '`task lint:scenarios`', 'scenarios'],
                  ['Code metrics in the README', '`task metrics:check`', 'metrics'],
                  ['Clean room scrub', '`task scrub`', 'scrub'],
                ],
              },
              {
                title: 'Build and tests',
                job: 'ci',
                rows: [
                  ['Build, warnings as errors', '`task build`', 'build'],
                  ['Unit tests', '`task test:unit`', 'unit'],
                  ['Architecture tests (NetArchTest)', '`task test:architecture`', 'architecture'],
                  ['Integration tests (behavior pins, LightBDD)', '`task test:integration`', 'integration'],
                  ['End-to-end tests (the sample apps)', '`task test:e2e`', 'e2e'],
                ],
              },
              {
                title: 'Packages and docs',
                job: 'ci',
                rows: [
                  ['NuGet packages, packed and validated', '`task pack`', 'pack'],
                  ['Samples, built and smoke-tested', '`task samples`', 'samples'],
                  ['Docs site install', '`task site:install`', 'site_install'],
                  ['Docs site sync tests, build and link check', '`task site:check`', 'site'],
                ],
              },
              {
                title: 'Workflows',
                job: 'ci-parity',
                rows: [['Every run step calls a task (ci-parity)', '`uses: jimmykurian/ci-parity`', '']],
              },
            ];

            const failed = Object.values(needs).some(({ result: r }) => r !== 'success');
            const lines = [];
            for (const { title, job, rows } of sections) {
              const { result: jobResult, outputs = {} } = needs[job] ?? {};
              lines.push(`### ${title}`, '');
              if (jobResult === 'cancelled') {
                lines.push('⏹️ *Cancelled*', '');
                continue;
              }
              lines.push('| Check | Task | Result |', '|:------|:-----|:-------|');
              for (const [label, how, key] of rows) {
                lines.push(`| ${label} | ${how} | ${result(key ? outputs[key] : jobResult)} |`);
              }
              lines.push('');
            }

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## PR check results',
              '',
              `**Overall:** ${failed ? '❌ Some checks failed or didn\'t run' : '✅ All checks passed'}`,
              '',
              ...lines,
              '---',
              `<sub>Commit \`${process.env.HEAD_SHA.slice(0, 7)}\` · [View run](${run})</sub>`,
              '',
              marker,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # Writes one shields.io endpoint JSON per check to the badges branch, for the README's
  # status table. Only main's results count. One commit through the Git Data API, so no git
  # credentials stay on the runner.
  badges:
    name: Badges
    needs: [ci, ci-parity]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # commits to the badges branch
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const badge = (message, color) => ({ schemaVersion: 1, label: '', message, color });
            const status = (outcome) =>
              outcome === 'success'
                ? badge('passing', 'brightgreen')
                : outcome === 'failure'
                  ? badge('failing', 'red')
                  : badge(outcome || 'not run', 'lightgrey');

            const c = needs.ci?.outputs ?? {};
            const files = {
              'checks/format.json': status(c.format),
              'checks/public-api.json': status(c.api),
              'checks/headers.json': status(c.headers),
              'checks/scenarios.json': status(c.scenarios),
              'checks/metrics.json': status(c.metrics),
              'checks/scrub.json': status(c.scrub),
              'checks/ci-parity.json': status(needs['ci-parity']?.result),
              'build/build.json': status(c.build),
              'build/unit-tests.json': status(c.unit),
              'build/architecture-tests.json': status(c.architecture),
              'build/integration-tests.json': status(c.integration),
              'build/e2e-tests.json': status(c.e2e),
              'build/samples.json': status(c.samples),
              'build/pack.json': status(c.pack),
              'build/docs-site.json': status(c.site),
            };

            const { owner, repo } = context.repo;
            const ref = 'heads/badges';
            let parent;
            try {
              parent = (await github.rest.git.getRef({ owner, repo, ref })).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              tree: Object.entries(files).map(([path, data]) => ({
                path,
                mode: '100644',
                type: 'blob',
                content: `${JSON.stringify(data)}\n`,
              })),
            });
            if (parent) {
              const { data: last } = await github.rest.git.getCommit({ owner, repo, commit_sha: parent });
              if (last.tree.sha === tree.data.sha) return core.info('Badges unchanged');
            }
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: `chore: update the CI badges for ${context.sha.slice(0, 7)}`,
              tree: tree.data.sha,
              parents: parent ? [parent] : [],
            });
            if (parent) await github.rest.git.updateRef({ owner, repo, ref, sha: commit.data.sha });
            else await github.rest.git.createRef({ owner, repo, ref: `refs/${ref}`, sha: commit.data.sha });
            core.info(`Updated ${Object.keys(files).length} badges`);
