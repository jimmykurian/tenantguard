version: "3"

vars:
  SOLUTION: TenantGuard.slnx
  CONFIGURATION: Release
  SAMPLES: HandRolled.Api Finbuckle.Api
  # The end-to-end tests in tests/e2e: one per sample app, the validate tool's and the probe adapters'.
  E2E_TESTS: HandRolled.Api.Tests Finbuckle.Api.Tests ValidateTool.Tests ProbeAdapters.Tests
  # Absolute: `dotnet test` in the .NET 11 RC SDK resolves a relative --project against the
  # project's own directory.
  TESTS: "{{.ROOT_DIR}}/tests"

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

tasks:
  build:
    desc: Restore and build the solution, warnings as errors
    cmds:
      - dotnet build {{.SOLUTION}} -c {{.CONFIGURATION}}

  test:
    desc: Run the unit, architecture, integration and end-to-end tests
    cmds:
      - task: test:unit
      - task: test:architecture
      - task: test:integration
      - task: test:e2e

  test:unit:
    desc: Run the unit tests (tests/unit)
    cmds:
      - dotnet test --project "{{.TESTS}}/unit/TenantGuard.Analyzers.Tests" -c {{.CONFIGURATION}}
      - dotnet test --project "{{.TESTS}}/unit/TenantGuard.EntityFrameworkCore.Tests" -c {{.CONFIGURATION}}
      - dotnet test --project "{{.TESTS}}/unit/TenantGuard.Tool.Tests" -c {{.CONFIGURATION}}

  test:architecture:
    desc: Run the architecture rules (tests/architecture) over the shipped assemblies
    cmds:
      - dotnet test --project "{{.TESTS}}/architecture/TenantGuard.Architecture.Tests" -c {{.CONFIGURATION}}

  test:integration:
    desc: Run the integration tests (tests/integration) except the provider tests
    cmds:
      - dotnet test --project "{{.TESTS}}/integration/TenantGuard.BehaviorPins" -c {{.CONFIGURATION}}
      - dotnet test --project "{{.TESTS}}/integration/TenantGuard.Testing.Tests" -c {{.CONFIGURATION}}

  test:e2e:
    desc: Run the end-to-end tests (tests/e2e) against the sample apps
    cmds:
      - for: { var: E2E_TESTS, split: " " }
        cmd: dotnet test --project "{{.TESTS}}/e2e/{{.ITEM}}" -c {{.CONFIGURATION}}

  # Opt-in: needs Docker, so test leaves it out and providers.yml runs it.
  test:providers:
    desc: Run the isolation probe on SQL Server and PostgreSQL in Testcontainers (needs Docker)
    cmds:
      - dotnet test --project "{{.TESTS}}/integration/TenantGuard.Providers.Tests" -c {{.CONFIGURATION}}

  lint:
    desc: Check formatting and analyzers, the public API files, the copyright headers, the LightBDD scenarios and the README's code metrics
    cmds:
      - task: lint:format
      - task: lint:api
      - task: lint:headers
      - task: lint:scenarios
      - task: metrics:check

  lint:format:
    desc: Check formatting and analyzers (dotnet format) on the solution, the samples, the end-to-end tests and tools/
    cmds:
      - dotnet format {{.SOLUTION}} --verify-no-changes
      - for: { var: SAMPLES, split: " " }
        cmd: dotnet format samples/{{.ITEM}} --verify-no-changes
      - for: { var: E2E_TESTS, split: " " }
        cmd: dotnet format tests/e2e/{{.ITEM}} --verify-no-changes
      - for: [ValidateTool.Fixture, ValidateTool.UnreferencedFixture]
        cmd: dotnet format tests/e2e/{{.ITEM}} --verify-no-changes
      - for: [ProbeAdapters.Store, ProbeAdapters.XunitFixture, ProbeAdapters.TUnitFixture]
        cmd: dotnet format tests/e2e/{{.ITEM}} --verify-no-changes
      - dotnet format tools/Metrics --verify-no-changes

  lint:api:
    desc: Fail when PublicAPI.Shipped.txt / PublicAPI.Unshipped.txt are out of date
    cmds:
      - for: [TenantGuard.EntityFrameworkCore, TenantGuard.Testing]
        cmd: >-
          dotnet build src/{{.ITEM}} -c {{.CONFIGURATION}} --no-incremental
          -warnaserror:RS0016,RS0017,RS0024,RS0025,RS0026,RS0036,RS0037

  lint:headers:
    desc: Check the YAML files and git hooks start with the copyright line (StyleCop checks C#)
    silent: true
    cmds:
      - |
        set -eu
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        # HEADER_FILES names a file listing paths one per line (the pre-commit hook's staged
        # files); the paths are read as data, never expanded by the shell.
        if [ -n "${HEADER_FILES:-}" ]; then cat "$HEADER_FILES"; else git ls-files; fi > "$tmp/all"
        # grep exits 1 when no path matches; that isn't a failure.
        # The pnpm lockfile is generated, so it has no header.
        grep -E '\.ya?ml$|^\.githooks/' "$tmp/all" | grep -vx 'site/pnpm-lock.yaml' > "$tmp/files" || [ $? -eq 1 ]
        status=0
        while IFS= read -r file; do
          [ -f "$file" ] || continue
          if ! head -n 3 "$file" | grep -qE '^# Copyright \(c\) Jimmy Kurian 20[0-9]{2}\. Licensed under the Apache License, Version 2\.0\.$'; then
            echo "lint:headers: $file: no copyright line in its first three lines"
            status=1
          fi
        done < "$tmp/files"
        exit $status

  lint:scenarios:
    desc: Fail on LightBDD's [Scenario], which xunit.v3 4 silently skips; scenarios run from [Fact]
    silent: true
    cmds:
      - |
        # LightBDD.XUnit3 3.12.1 does not load on xunit.v3 4, so a [Scenario] test is dropped
        # without a word (LightBDD#409). Remove this check once LightBDD supports xunit.v3 4.
        if git grep -nE '^[[:space:]]*\[Scenario[](,]' -- 'tests/*.cs'; then
          echo "lint:scenarios: run the scenario from [Fact]; xunit.v3 4 skips [Scenario] (LightBDD#409)" >&2
          exit 1
        fi

  metrics:
    desc: Print the code metrics (lines of code, method complexity) of the C# code git tracks
    cmds:
      - dotnet run --project "{{.ROOT_DIR}}/tools/Metrics" -c {{.CONFIGURATION}} -- --print

  metrics:readme:
    desc: Write the code metrics into the README's METRICS block
    cmds:
      - dotnet run --project "{{.ROOT_DIR}}/tools/Metrics" -c {{.CONFIGURATION}} -- --write README.md

  metrics:check:
    desc: Fail when the README's code metrics are out of date (CI and the pre-push hook run this)
    cmds:
      - dotnet run --project "{{.ROOT_DIR}}/tools/Metrics" -c {{.CONFIGURATION}} -- --check README.md

  site:install:
    desc: Install the docs site's packages (site/, pinned in its lockfile)
    dir: site
    preconditions:
      - sh: command -v pnpm
        msg: "pnpm not found on PATH; install Node.js 22 or later and pnpm (corepack enable pnpm)"
      # A registry mirror in ~/.npmrc makes pnpm record its own download URLs. They don't
      # resolve elsewhere and name the mirror, so the lockfile keeps integrity hashes only.
      - sh: "! grep -q 'tarball:' pnpm-lock.yaml"
        msg: "site/pnpm-lock.yaml records tarball URLs from a registry mirror; remove them (keep the integrity hashes) before committing"
    cmds:
      - pnpm install --frozen-lockfile

  site:sync:
    desc: Copy docs/ into the docs site's pages
    dir: site
    cmds:
      - node scripts/sync-docs.mjs

  site:test:
    desc: Run the docs sync script's unit tests
    dir: site
    cmds:
      - pnpm test

  site:build:
    desc: Build the docs site into site/dist, failing on a broken link or anchor
    dir: site
    cmds:
      - task: site:sync
      - pnpm build

  site:check:
    desc: Test the docs sync script, then build the docs site (CI runs this)
    cmds:
      - task: site:test
      - task: site:build

  site:dev:
    desc: Serve the docs site with live reload (run task site:sync after editing docs/)
    dir: site
    cmds:
      - task: site:sync
      - pnpm dev

  fmt:
    desc: Format the solution and the samples
    cmds:
      - dotnet format {{.SOLUTION}}
      - for: { var: SAMPLES, split: " " }
        cmd: dotnet format samples/{{.ITEM}}
      - for: { var: E2E_TESTS, split: " " }
        cmd: dotnet format tests/e2e/{{.ITEM}}
      - dotnet format tools/Metrics

  pack:
    desc: Build the NuGet packages into ./artifacts/ and validate them
    cmds:
      - rm -rf artifacts
      # ContinuousIntegrationBuild maps source paths to /_/, so the symbols match on any machine.
      - dotnet pack {{.SOLUTION}} -c {{.CONFIGURATION}} -o artifacts -p:ContinuousIntegrationBuild=true
      - dotnet tool restore
      # PackageIdAvailableOnNuGetOrg fails once a version is on nuget.org. Rules 119 and 120
      # download each source file from GitHub at the commit SourceLink names and compare its
      # hash, so they only pass for a pushed commit with no local changes: CI runs them
      # (GitHub sets CI), a local pack skips them.
      - >-
        dotnet meziantou.validate-nuget-package artifacts/*.nupkg
        --excluded-rules PackageIdAvailableOnNuGetOrg
        {{if not .CI}}--excluded-rule-ids 119 --excluded-rule-ids 120{{end}}

  # The release workflow (release.yml) runs these two after task pack.
  release:push:
    desc: Push the packages in ./artifacts/ to nuget.org with the key in $NUGET_API_KEY
    preconditions:
      - sh: '[ -n "${NUGET_API_KEY:-}" ]'
        msg: NUGET_API_KEY is not set; the release workflow gets it from NuGet/login.
    cmds:
      # The .snupkg symbol packages go up with their .nupkg. A rerun skips what's already there.
      - >-
        dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY"
        --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:attach:
    desc: "Attach the packages in ./artifacts/ to a GitHub Release: task release:attach -- vX.Y.Z"
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: Pass the release tag, as in task release:attach -- v0.1.0.
    cmds:
      - gh release upload "{{.CLI_ARGS}}" artifacts/*.nupkg artifacts/*.snupkg --clobber

  samples:
    desc: Build the samples and smoke-test each one (task test:e2e runs their tests)
    cmds:
      - for: { var: SAMPLES, split: " " }
        cmd: dotnet build samples/{{.ITEM}} -c {{.CONFIGURATION}}
      - for: { var: SAMPLES, split: " " }
        cmd: dotnet run --project samples/{{.ITEM}} -c {{.CONFIGURATION}} --no-build -- --smoke --urls http://127.0.0.1:0

  scrub:
    desc: Grep the tree for the private terms in $SCRUB_TERMS_FILE
    silent: true
    cmds:
      - |
        set -eu
        if [ -z "${SCRUB_TERMS_FILE:-}" ]; then
          echo "scrub: warning: SCRUB_TERMS_FILE is not set; skipping"
          exit 0
        fi
        if [ ! -r "$SCRUB_TERMS_FILE" ]; then
          echo "scrub: SCRUB_TERMS_FILE is set but not readable" >&2
          exit 1
        fi
        terms="$(mktemp)"
        trap 'rm -f "$terms"' EXIT
        grep -v '^[[:space:]]*$' "$SCRUB_TERMS_FILE" > "$terms" || true
        if [ ! -s "$terms" ]; then
          echo "scrub: warning: SCRUB_TERMS_FILE has no terms; skipping"
          exit 0
        fi
        # What git would commit: tracked files and new ones it doesn't ignore, so build
        # output and installed packages (bin/, obj/, site/node_modules/) are never scanned.
        # File names only: the terms themselves must not reach the log.
        hits="$(git ls-files -z --cached --others --exclude-standard \
          | xargs -0 grep -IilF -f "$terms" -- 2>/dev/null || true)"
        if [ -n "$hits" ]; then
          echo "scrub: private terms found in:" >&2
          echo "$hits" >&2
          exit 1
        fi
        echo "scrub: clean"

  hooks:install:
    desc: Use the git hooks in .githooks/ (pre-commit, commit-msg, pre-push)
    cmds:
      - git config core.hooksPath .githooks

  ci:
    desc: Run lint, build, test, pack, samples, scrub and the docs site, as CI does
    cmds:
      - task: lint
      - task: build
      - task: test
      - task: pack
      - task: samples
      - task: scrub
      - task: site:install
      - task: site:check
