<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 610" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <title id="title">TenantGuard at build, at startup, on SaveChanges and in tests</title>
  <desc id="desc">A terminal walkthrough in four steps. At build, dotnet build warns TG001 on an IgnoreQueryFilters call. At startup, dotnet run fails with TGM001: Invoice has a tenant property but no query filter references it. On SaveChanges, TenantGuard logs that it blocked a cross-tenant write and throws TenantIsolationViolationException: an Invoice for tenant acme added while the current tenant is globex. In tests, the isolation probe reports 3 of 24 checks failed: Customer's read, find and bulk delete checks.</desc>
