  <circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="18" y="46" xml:space="preserve" class="c a0"># 1  At build: the analyzers flag code that switches the tenant filter off</text>
  <text x="18" y="67" class="p a1">$</text>
  <text x="34.8" y="67" class="w a2">d</text>
  <text x="43.2" y="67" class="w a3">o</text>
  <text x="51.6" y="67" class="w a4">t</text>
  <text x="60.0" y="67" class="w a5">n</text>
  <text x="68.4" y="67" class="w a6">e</text>
  <text x="76.8" y="67" class="w a7">t</text>
  <text x="85.2" y="67" class="w a8"> </text>
  <text x="93.6" y="67" class="w a9">b</text>
  <text x="102.0" y="67" class="w a10">u</text>
  <text x="110.4" y="67" class="w a11">i</text>
  <text x="118.8" y="67" class="w a12">l</text>
  <text x="127.2" y="67" class="w a13">d</text>
  <text x="18" y="88" xml:space="preserve" class="a14"><tspan class="w">Reports.cs(12,40): </tspan><tspan class="y">warning TG001</tspan><tspan class="w">: IgnoreQueryFilters disables the tenant filter. Add [AllowCrossTenantAccess(&quot;why&quot;)]</tspan></text>
  <text x="18" y="109" xml:space="preserve" class="a15"><tspan class="w">  to the method, or ignore only the non-tenant filters by name.</tspan></text>
  <text x="18" y="151" xml:space="preserve" class="c a16"># 2  At startup: the model rules fail the host on an entity with no tenant filter</text>
  <text x="18" y="172" class="p a17">$</text>
  <text x="34.8" y="172" class="w a18">d</text>
  <text x="43.2" y="172" class="w a19">o</text>
  <text x="51.6" y="172" class="w a20">t</text>
  <text x="60.0" y="172" class="w a21">n</text>
  <text x="68.4" y="172" class="w a22">e</text>
  <text x="76.8" y="172" class="w a23">t</text>
  <text x="85.2" y="172" class="w a24"> </text>
  <text x="93.6" y="172" class="w a25">r</text>
  <text x="102.0" y="172" class="w a26">u</text>
  <text x="110.4" y="172" class="w a27">n</text>
  <text x="18" y="193" xml:space="preserve" class="a28"><tspan class="r">Unhandled exception. TenantGuard.TenantGuardModelException</tspan><tspan class="w">: TenantGuard found 1 model error:</tspan></text>
  <text x="18" y="214" xml:space="preserve" class="a29"><tspan class="w">- </tspan><tspan class="r">TGM001</tspan><tspan class="w">: Invoice has tenant property &#x27;TenantId&#x27; but no query filter references it.</tspan></text>
  <text x="18" y="235" xml:space="preserve" class="a30"><tspan class="w">  Add HasQueryFilter(e =&gt; e.TenantId == &lt;current tenant&gt;) on the root type.</tspan></text>
  <text x="18" y="277" xml:space="preserve" class="c a31"># 3  On SaveChanges: the write guard stops a write into another tenant, before the database</text>
  <text x="18" y="298" xml:space="preserve" class="a32"><tspan class="r">fail</tspan><tspan class="w">: TenantGuard[5]</tspan></text>
  <text x="18" y="319" xml:space="preserve" class="a33"><tspan class="w">      TenantGuard blocked SaveChanges on AppDbContext; cross-tenant writes: 1</tspan></text>
  <text x="18" y="340" xml:space="preserve" class="a34"><tspan class="r">TenantGuard.TenantIsolationViolationException</tspan><tspan class="w">: TenantGuard blocked 1 write outside the current tenant &quot;globex&quot;:</tspan></text>
  <text x="18" y="361" xml:space="preserve" class="a35"><tspan class="w">- Added Invoice (Id: 7): TenantId is &quot;acme&quot;</tspan></text>
  <text x="18" y="382" xml:space="preserve" class="a36"><tspan class="w">Write only rows of the current tenant, or wrap a write meant to cross tenants in context.TenantGuard().Bypass(reason).</tspan></text>
  <text x="18" y="424" xml:space="preserve" class="c a37"># 4  In tests: the isolation probe proves every entity, tenant by tenant</text>
  <text x="18" y="445" class="p a38">$</text>
  <text x="34.8" y="445" class="w a39">d</text>
  <text x="43.2" y="445" class="w a40">o</text>
  <text x="51.6" y="445" class="w a41">t</text>
  <text x="60.0" y="445" class="w a42">n</text>
  <text x="68.4" y="445" class="w a43">e</text>
  <text x="76.8" y="445" class="w a44">t</text>
  <text x="85.2" y="445" class="w a45"> </text>
  <text x="93.6" y="445" class="w a46">t</text>
  <text x="102.0" y="445" class="w a47">e</text>
  <text x="110.4" y="445" class="w a48">s</text>
  <text x="118.8" y="445" class="w a49">t</text>
  <text x="18" y="466" xml:space="preserve" class="a50"><tspan class="r">TenantGuard isolation probe: 3 of 24 checks did not pass.</tspan></text>
  <text x="18" y="487" xml:space="preserve" class="a51"><tspan class="w">Entity    Check          Outcome  Detail</tspan></text>
  <text x="18" y="508" xml:space="preserve" class="a52"><tspan class="d">--------  -------------  -------  ------</tspan></text>
  <text x="18" y="529" xml:space="preserve" class="a53"><tspan class="w">Customer  ReadIsolation  </tspan><tspan class="r">Failed</tspan><tspan class="w">   As acme, Set&lt;Customer&gt;() returned globex&#x27;s row (Id: 2). ...</tspan></text>
  <text x="18" y="550" xml:space="preserve" class="a54"><tspan class="w">Customer  FindIsolation  </tspan><tspan class="r">Failed</tspan><tspan class="w">   As acme, FindAsync(Id: 2) returned globex&#x27;s row. ...</tspan></text>
  <text x="18" y="571" xml:space="preserve" class="a55"><tspan class="w">Customer  BulkIsolation  </tspan><tspan class="r">Failed</tspan><tspan class="w">   As acme, ExecuteDelete removed globex&#x27;s row (Id: 2). ...</tspan></text>
</svg>
